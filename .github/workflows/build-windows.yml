name: Build Windows NSIS Installer

on:
  workflow_dispatch:
    inputs:
      offline_webview2:
        description: 'Embed offline WebView2 Evergreen Standalone x64 installer (air-gapped NSIS)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}

      - name: Install dependencies & verify TypeScript tests
        run: |
          npm ci
          npm run lint
          npm run test:engine
          npm run build

      - name: Install sidecar dependencies & run Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements-lock.txt
          python -m unittest -v tests/python/test_sidecar.py

      - name: Freeze Python sidecar (--onedir)
        working-directory: sidecar
        run: pyinstaller --clean --noconfirm energybaseline_sidecar.spec

      - name: Build Tauri 2 Windows NSIS Installer
        shell: pwsh
        run: |
          if ("${{ inputs.offline_webview2 }}" -eq "true" -or "${{ github.event_name }}" -eq "push") {
            New-Item -ItemType Directory -Force -Path "src-tauri/webview2" | Out-Null
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "src-tauri/webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
            $cfg = '{"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller","path":"webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"}}}}'
            npm run tauri:build -- --config $cfg
          } else {
            npm run tauri:build
          }

      - name: Upload Windows NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyBaseline-Windows-NSIS-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
