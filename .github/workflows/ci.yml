name: Cross-platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cargo-lock:
    name: Resolve Cargo lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile for bootstrap validation
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Expose Cargo lockfile for local bootstrap
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(xz -9e -c src-tauri/Cargo.lock | base64 -w0)"
          part=1
          while IFS= read -r chunk || [[ -n "$chunk" ]]; do
            printf '::notice title=CARGOLOCK_PART_%03d::%s\n' "$part" "$chunk"
            part=$((part + 1))
          # Keep ten-or-fewer chunks under GitHub's 4 KiB annotation payload limit.
          done < <(printf '%s' "$encoded" | fold -w 3900)

      - name: Upload Cargo lockfile for Phase 0 bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile-bootstrap
          path: src-tauri/Cargo.lock
          if-no-files-found: error

  validate:
    name: Validate (${{ matrix.os }})
    needs: cargo-lock
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated Cargo lockfile
        uses: actions/download-artifact@v4
        with:
          name: cargo-lockfile-bootstrap
          path: src-tauri

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: TypeScript lint
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "typescript-lint.log"
          npm run lint *> $log
          $lintExitCode = $LASTEXITCODE
          if ($lintExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 30
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=TypeScript lint details::$detail"
          } else {
            Get-Content $log
          }
          exit $lintExitCode

      - name: TypeScript engine tests
        run: npm run test:engine

      - name: Production frontend build
        run: npm run build

      - name: Verify Rust/Python RPC allowlist parity
        run: python scripts/check_rpc_allowlist.py

      - name: Run Python sidecar tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "python-tests.log"
          python -m unittest -v tests/python/test_sidecar.py *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 45
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Python test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Run locked Rust integration tests (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-tests.log"
          cargo test --lib --locked --features integration *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Run locked Rust unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-tests.log"
          cargo test --lib --locked *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Verify locked native Cargo build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-build.log"
          cargo build --release --locked *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 45
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

      - name: Verify Tauri CLI build path
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "tauri-cli-build.log"
          npm run tauri:build -- --no-bundle *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri CLI build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

  package-windows:
    name: Package Windows installer (M-1)
    needs: cargo-lock
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated Cargo lockfile
        uses: actions/download-artifact@v4
        with:
          name: cargo-lockfile-bootstrap
          path: src-tauri

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Freeze the onedir sidecar
        working-directory: sidecar
        run: pyinstaller --clean --noconfirm energybaseline_sidecar.spec

      - name: Verify frozen sidecar handshake and stdin-EOF shutdown
        run: python -m unittest -v tests/python/test_sidecar.py

      - name: Build Windows NSIS installer with bundled onedir resources
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-nsis-build.log"
          npm run tauri:build *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 70
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows NSIS build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

      - name: Verify and upload Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          Write-Output "Installer: $($installer.FullName) ($($installer.Length) bytes)"
          $installDir = Join-Path $env:RUNNER_TEMP "EnergyBaseline-M1"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS silent installation failed with exit code $($install.ExitCode)"
          }
          $frozenSidecar = Join-Path $installDir "energybaseline_sidecar/energybaseline_sidecar.exe"
          if (-not (Test-Path $frozenSidecar)) {
            throw "Installed onedir resource not found at $frozenSidecar"
          }
          $env:ENERGYBASELINE_FROZEN_SIDECAR = $frozenSidecar
          python -m unittest -v tests/python/test_sidecar.py
          if ($LASTEXITCODE -ne 0) {
            throw "The frozen sidecar did not pass its post-install IPC smoke test"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EnergyBaseline-Windows-NSIS-M1
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
