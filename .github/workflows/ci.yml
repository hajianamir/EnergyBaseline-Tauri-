name: Cross-platform validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      diagnose_tauri_test_loader:
        description: "Opt in to a non-blocking Windows tauri/test loader diagnostic"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: TypeScript lint
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "typescript-lint.log"
          npm run lint *> $log
          $lintExitCode = $LASTEXITCODE
          if ($lintExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 30
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=TypeScript lint details::$detail"
          } else {
            Get-Content $log
          }
          exit $lintExitCode

      - name: TypeScript engine tests
        run: npm run test:engine

      - name: Production frontend build
        run: npm run build

      - name: Verify Rust/Python RPC allowlist parity
        run: python scripts/check_rpc_allowlist.py

      - name: Run Python sidecar tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "python-tests.log"
          python -m unittest -v tests/python/test_sidecar.py *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 45
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Python test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Collect opt-in Windows tauri/test loader diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_tauri_test_loader == 'true' && runner.os == 'Windows' }}
        continue-on-error: true
        working-directory: src-tauri
        shell: pwsh
        run: |
          $diagDir = Join-Path $env:RUNNER_TEMP "tauri-test-loader"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $buildLog = Join-Path $diagDir "cargo-test-no-run.log"
          $diagLog = Join-Path $diagDir "binary-loader-diagnostics.log"

          cargo test --lib --locked --features integration --no-run *> $buildLog
          $buildExitCode = $LASTEXITCODE
          Get-Content $buildLog
          if ($buildExitCode -ne 0) {
            throw "Could not build the tauri/test diagnostic binary (exit $buildExitCode)."
          }

          $testBin = Get-ChildItem -Path "target/debug" -Filter "energybaseline_lib-*.exe" -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $testBin) {
            throw "Could not locate the tauri/test binary under target/debug."
          }
          "Test binary: $($testBin.FullName)" | Tee-Object -FilePath $diagLog

          $dumpbinPath = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          if (-not $dumpbinPath) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = (& $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
              if ($vsInstall) {
                $msvcRoot = Join-Path $vsInstall "VC/Tools/MSVC"
                $toolsets = Get-ChildItem -Path $msvcRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
                foreach ($toolset in $toolsets) {
                  foreach ($hostTarget in @("Hostx64/x64", "Hostx86/x64")) {
                    $candidate = Join-Path $toolset.FullName "bin/$hostTarget/dumpbin.exe"
                    if (Test-Path $candidate) {
                      $dumpbinPath = $candidate
                      break
                    }
                  }
                  if ($dumpbinPath) { break }
                }
              }
            }
          }

          if ($dumpbinPath) {
            foreach ($mode in @("/dependents", "/imports")) {
              "=== dumpbin $mode ===" | Tee-Object -FilePath $diagLog -Append
              & $dumpbinPath $mode $testBin.FullName 2>&1 | Tee-Object -FilePath $diagLog -Append
            }
          } else {
            "dumpbin.exe was not found on this Windows runner." | Tee-Object -FilePath $diagLog -Append
          }

          "=== test binary --list ===" | Tee-Object -FilePath $diagLog -Append
          $testProcess = Start-Process -FilePath $testBin.FullName -ArgumentList "--list" -Wait -PassThru
          "Test binary exit code: $($testProcess.ExitCode)" | Tee-Object -FilePath $diagLog -Append

          try {
            $events = Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 50 -ErrorAction Stop |
              Where-Object { $_.ProviderName -in @("Application Error", "Windows Error Reporting") } |
              Select-Object TimeCreated, Id, ProviderName, Message
            $events | Format-List | Out-File -FilePath (Join-Path $diagDir "application-errors.txt") -Encoding utf8
          } catch {
            $_.Exception.Message | Out-File -FilePath (Join-Path $diagDir "application-errors.txt") -Encoding utf8
          }

      - name: Upload Windows tauri/test loader diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_tauri_test_loader == 'true' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-test-loader-diagnostics
          path: ${{ runner.temp }}/tauri-test-loader/
          if-no-files-found: warn

      - name: Run locked MockRuntime RPC integration tests (Linux only)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-tests.log"
          cargo test --lib --locked --features integration *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Run locked non-integration Rust unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-tests.log"
          cargo test --lib --locked *> $log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo test details::$detail"
          } else {
            Get-Content $log
          }
          exit $testExitCode

      - name: Verify locked native Cargo build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-build.log"
          cargo build --release --locked *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 45
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Cargo build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

      - name: Verify Tauri CLI build path
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "tauri-cli-build.log"
          npm run tauri:build -- --no-bundle *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 60
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri CLI build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

  package-windows:
    name: Package Windows installer (M-1)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Freeze the onedir sidecar
        working-directory: sidecar
        run: pyinstaller --clean --noconfirm energybaseline_sidecar.spec

      - name: Verify frozen sidecar handshake and stdin-EOF shutdown
        run: python -m unittest -v tests/python/test_sidecar.py

      - name: Build Windows NSIS installer with bundled onedir resources
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-nsis-build.log"
          npm run tauri:build *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = Get-Content $log -Tail 70
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows NSIS build details::$detail"
          } else {
            Get-Content $log
          }
          exit $buildExitCode

      - name: Verify and upload Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          Write-Output "Installer: $($installer.FullName) ($($installer.Length) bytes)"
          $installDir = Join-Path $env:RUNNER_TEMP "EnergyBaseline-M1"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS silent installation failed with exit code $($install.ExitCode)"
          }
          $frozenSidecar = Join-Path $installDir "energybaseline_sidecar/energybaseline_sidecar.exe"
          if (-not (Test-Path $frozenSidecar)) {
            throw "Installed onedir resource not found at $frozenSidecar"
          }
          $env:ENERGYBASELINE_FROZEN_SIDECAR = $frozenSidecar
          python -m unittest -v tests/python/test_sidecar.py
          if ($LASTEXITCODE -ne 0) {
            throw "The frozen sidecar did not pass its post-install IPC smoke test"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EnergyBaseline-Windows-NSIS-M1
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
